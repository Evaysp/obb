[project]
name = "observer-backend"
version = "0.1.0"
description = "Observer news aggregator — API, workers, fetchers"
requires-python = ">=3.12"
dependencies = [
  # web
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "httpx>=0.27,<0.28",

  # data
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "pgvector>=0.3,<0.4",

  # config / schema
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",

  # security
  "cryptography>=43,<44",
  "passlib[argon2]>=1.7.4,<2",
  "argon2-cffi>=23.1,<24",

  # task queue
  "celery[redis]>=5.4,<6",

  # scraping / parsing
  "feedparser>=6.0.11,<7",
  "trafilatura>=1.12,<2",
  "beautifulsoup4>=4.12,<5",
  "bleach>=6.1,<7",
  "python-dateutil>=2.9,<3",
  "playwright>=1.40,<2",

  # logging
  "structlog>=24.4,<25",
  "rich>=13.9,<14",

  # misc
  "aiolimiter>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2",
  "types-bleach",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
