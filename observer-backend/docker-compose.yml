# Dev stack: postgres, redis, api, worker.
# `docker compose up` brings up the whole chain. The API auto-runs migrations
# + seeds before starting uvicorn (see `command`).
#
# Ports are non-default (5433 / 6380) so they don't collide with anything else
# you might be running on 5432 / 6379.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: observer
      POSTGRES_DB: observer
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d observer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      APP_LOG_LEVEL: INFO
      APP_CORS_ORIGINS: "http://localhost:3000,http://192.168.31.145:3000"
      DB_URL: postgresql+asyncpg://observer:observer@db:5432/observer
      REDIS_URL: redis://redis:6379/0
      # Dev-only placeholder key (valid Fernet format: 32 bytes url-safe base64).
      # Rotate before shipping anywhere real. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY:-bWey3zdLKSyLlvjklQszBpTQr0Kilu7rEbJNcfFtVpw=}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      FETCH_USER_AGENT: "Observer/0.1 (+https://example.com/bot)"
      FETCH_TIMEOUT_SECONDS: "30"
      FETCH_DEFAULT_RATE_PER_MIN: "6"
      DEV_USER_EMAIL: me@localhost
      DEV_USER_ID: 00000000-0000-0000-0000-000000000001
    ports:
      - "8000:8000"
    # Run migrations + seed on boot, then start uvicorn with reload for dev.
    command: >
      sh -c "alembic upgrade head
      && python -m scripts.seed
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_ENV: dev
      APP_LOG_LEVEL: INFO
      DB_URL: postgresql+asyncpg://observer:observer@db:5432/observer
      REDIS_URL: redis://redis:6379/0
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY:-bWey3zdLKSyLlvjklQszBpTQr0Kilu7rEbJNcfFtVpw=}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      FETCH_USER_AGENT: "Observer/0.1 (+https://example.com/bot)"
      FETCH_TIMEOUT_SECONDS: "30"
      FETCH_DEFAULT_RATE_PER_MIN: "6"
      DEV_USER_EMAIL: me@localhost
      DEV_USER_ID: 00000000-0000-0000-0000-000000000001
    # pool=solo so asyncio inside tasks doesn't conflict with prefork (CONVENTIONS §11).
    command: >
      celery -A workers.celery_app.celery_app worker
      --loglevel=info --pool=solo --queues=default,fetch
    volumes:
      - .:/app

volumes:
  db_data:
